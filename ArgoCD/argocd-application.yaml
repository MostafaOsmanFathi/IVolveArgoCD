apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ivolve
  namespace: argocd
spec:
  destination:
    name: in-cluster
    namespace: ivolve
  project: default
  source:
    path: ArgoCD/
    repoURL: https://github.com/MostafaOsmanFathi/IVolveArgoCD.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true