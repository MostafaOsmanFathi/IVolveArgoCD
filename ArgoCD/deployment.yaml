apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivolveapp
  namespace: ivolve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ivolveapp
  template:
    metadata:
      labels:
        app: ivolveapp
    spec:
      containers:
      - env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              key: DB_HOST
              name: ivolvecm
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              key: DB_USER
              name: ivolvecm
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: ivolvesecret
        - name: DB_NAME
          value: ivolve
        image: mostafaosmanfathi/ivolve-nodejs-app:latest
        imagePullPolicy: Always
        name: node-app
        ports:
        - containerPort: 3000
          protocol: TCP
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - mountPath: /app/logs
          name: app-logs
      initContainers:
      - args:
        - "until mysqladmin ping -h \"$DB_HOST\" -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent; do\n  echo \"Waiting for MySQL...\"\
          \n  sleep 5\ndone\n\nmysql -h \"$DB_HOST\" -uroot -p\"$MYSQL_ROOT_PASSWORD\" <<SQL\nCREATE DATABASE IF NOT EXISTS\
          \ ivolve;\nCREATE USER IF NOT EXISTS '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASSWORD}';\nGRANT ALL PRIVILEGES ON ivolve.*\
          \ TO '${DB_USER}'@'%';\nFLUSH PRIVILEGES;\nSQL\necho \"Database and privileges configured successfully.\"\n"
        command:
        - /bin/sh
        - -c
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              key: DB_HOST
              name: ivolvecm
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              key: DB_USER
              name: ivolvecm
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: MYSQL_ROOT_PASSWORD
              name: ivolvesecret
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: ivolvesecret
        image: mysql:8.4
        imagePullPolicy: IfNotPresent
        name: setup-database
      nodeSelector:
        project: ivolve
      restartPolicy: Always
      tolerations:
      - effect: NoSchedule
        key: workload
        operator: Equal
        value: ivolveApp
      volumes:
      - name: app-logs
        persistentVolumeClaim:
          claimName: ivolve-app-pvc
      imagePullSecrets:
      - name: dockerhub-secret
